<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f2" />
  <title>织思 · 对话思维图谱</title>
  <style>
    :root {
      --paper: #f7f6f2;
      --panel: #fffefa;
      --ink: #202421;
      --muted: #858a82;
      --line: #e9e7df;
      --green: #315b48;
      --green-soft: #e9f0e9;
      --lavender: #eeeaf6;
      --amber: #f7eedb;
      --shadow: 0 14px 38px rgba(35, 39, 33, .07);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; }
    button, input, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .app { height: 100vh; min-height: 680px; display: flex; overflow: hidden; }
    .sidebar { width: 244px; flex: 0 0 244px; background: #f1f0eb; border-right: 1px solid #e7e5de; padding: 22px 14px 16px; display: flex; flex-direction: column; transition: width .2s, flex-basis .2s, padding .2s; overflow: hidden; }
    .sidebar.collapsed { width: 68px; flex-basis: 68px; padding-left: 10px; padding-right: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 7px; margin-bottom: 26px; white-space: nowrap; }
    .brand-mark { width: 34px; height: 34px; flex: none; border-radius: 12px; display: grid; place-items: center; color: #f8f7f1; background: var(--green); font-size: 18px; }
    .brand-name { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
    .brand-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .05em; }
    .new-chat { height: 40px; border: 1px solid #deded5; border-radius: 11px; background: var(--panel); display: flex; align-items: center; gap: 10px; padding: 0 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 6px #2c382a08; }
    .new-chat:hover, .icon-btn:hover, .quiet-btn:hover { background: #f3f5ef; }
    .sidebar-label { padding: 22px 10px 8px; text-transform: uppercase; letter-spacing: .12em; color: #989b93; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .nav-item { min-height: 38px; display: flex; align-items: center; gap: 10px; border-radius: 9px; padding: 0 10px; color: #656c64; white-space: nowrap; }
    .nav-item.active { background: #e6e9e1; color: #2c4e3e; font-weight: 650; }
    .nav-icon { width: 16px; flex: none; text-align: center; color: #717a70; font-size: 14px; }
    .nav-item .count { margin-left: auto; font-size: 11px; color: #9a9d95; }
    .conversation-list { display: grid; gap: 3px; }
    .conversation { border: 0; width: 100%; background: transparent; text-align: left; padding: 10px 10px; border-radius: 9px; color: #626961; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conversation.active { color: var(--ink); background: #e8e8e1; font-weight: 600; }
    .conversation small { display: block; font-size: 10px; margin-top: 4px; color: #979b93; font-weight: 450; }
    .sidebar-spacer { flex: 1; }
    .profile { border-top: 1px solid #e1dfd7; padding: 14px 5px 0; display: flex; gap: 9px; align-items: center; white-space: nowrap; }
    .avatar { width: 29px; height: 29px; border-radius: 50%; background: #ddd8ca; color: #514c3e; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
    .profile-name { font-size: 12px; font-weight: 600; }
    .profile-plan { color: #92958e; font-size: 10px; margin-top: 2px; }
    .collapsed .brand-copy, .collapsed .new-label, .collapsed .sidebar-label, .collapsed .nav-copy, .collapsed .count, .collapsed .conversation-list, .collapsed .profile-copy { display: none; }
    .collapsed .brand { padding: 0 6px; }
    .collapsed .new-chat { justify-content: center; padding: 0; }
    .collapsed .nav-item { justify-content: center; padding: 0; }
    .collapsed .profile { justify-content: center; padding-left: 0; padding-right: 0; }

    .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .topbar { height: 62px; flex: none; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 0 22px; background: rgba(255,254,250,.75); }
    .top-left, .top-actions { display: flex; align-items: center; gap: 11px; }
    .crumb { color: #8a8e86; font-size: 12px; }
    .crumb strong { color: #333a34; font-weight: 600; }
    .top-actions { gap: 8px; }
    .icon-btn, .quiet-btn { border: 1px solid transparent; background: transparent; border-radius: 9px; min-height: 34px; padding: 0 10px; color: #697067; }
    .quiet-btn { border-color: #e7e5de; background: #fffefa; color: #485147; font-size: 12px; }
    .save-indicator { color: #8e958a; font-size: 11px; margin-right: 3px; }
    .content { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(480px, 1fr) 365px; }
    .workspace { min-width: 0; display: flex; flex-direction: column; padding: 23px 24px 20px; }
    .workspace-heading { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 12px; }
    .eyebrow { color: #849083; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; }
    h1 { margin: 5px 0 0; font-size: 21px; letter-spacing: -.035em; font-weight: 660; }
    .subtitle { margin-top: 5px; font-size: 12px; color: #858b82; }
    .view-actions { display: flex; align-items: center; gap: 6px; }
    .map-card { position: relative; overflow: hidden; flex: 1; min-height: 420px; border: 1px solid #e8e6de; border-radius: 17px; background-color: #fbfaf7; background-image: radial-gradient(#d8d7cf 0.8px, transparent 0.8px); background-size: 21px 21px; box-shadow: 0 3px 12px #30392b05 inset; }
    .map-card:before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg,rgba(251,250,247,.96),rgba(251,250,247,.10) 24%,transparent 68%,rgba(251,250,247,.54)); z-index: 1; }
    .canvas-note { position: absolute; left: 23px; top: 20px; z-index: 2; pointer-events: none; }
    .canvas-note strong { font-size: 12px; font-weight: 650; }
    .canvas-note span { color: #999d94; font-size: 10px; margin-left: 8px; }
    .map-world { position: absolute; inset: 0; transform: scale(var(--zoom,1)); transform-origin: center; transition: transform .2s; }
    .edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .edge { fill: none; stroke: #c9cec4; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .edge.active { stroke: #6c8a74; stroke-width: 2; stroke-dasharray: none; }
    .edge-label { font-size: 10px; fill: #9a9d95; }
    .node { position: absolute; width: 204px; min-height: 92px; padding: 13px 14px 12px; border: 1px solid #e4e3dc; background: rgba(255,254,250,.96); border-radius: 13px; box-shadow: 0 6px 18px rgba(38,45,35,.055); text-align: left; transform: translate(-50%,-50%); z-index: 2; transition: box-shadow .16s, border-color .16s, transform .16s; }
    .node:hover { transform: translate(-50%,-52%); box-shadow: 0 10px 22px rgba(38,45,35,.1); }
    .node.selected { border-color: #698573; box-shadow: 0 0 0 3px rgba(91,129,101,.12), 0 8px 20px rgba(38,45,35,.08); }
    .node.root { background: #315b48; border-color: #315b48; color: #fff; width: 220px; }
    .node.root .node-meta, .node.root .node-title { color: #fff; }
    .node.root .node-tag { color: #daeadb; background: rgba(255,255,255,.14); }
    .node-meta { display: flex; justify-content: space-between; align-items: center; color: #92968e; font-size: 9px; margin-bottom: 8px; }
    .node-type { display: flex; align-items: center; gap: 5px; }
    .node-dot { width: 6px; height: 6px; border-radius: 50%; background: #a7b5a3; }
    .node-tag { padding: 3px 6px; border-radius: 5px; background: #f2f1eb; color: #878c82; }
    .node-title { font-size: 12px; line-height: 1.55; font-weight: 640; color: #323933; }
    .node-footer { display: flex; gap: 5px; margin-top: 9px; }
    .node-chip { color: #879085; font-size: 9px; border-radius: 5px; background: #f6f5f0; padding: 3px 6px; }
    .node.root .node-chip { color: #e7efe7; background: rgba(255,255,255,.12); }
    .zoom-controls { position: absolute; right: 16px; bottom: 15px; z-index: 3; display: flex; align-items: center; padding: 4px; gap: 3px; background: #fffefa; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 12px #0000000b; }
    .zoom-controls button { width: 29px; height: 27px; border: 0; background: transparent; border-radius: 6px; color: #72796f; }
    .zoom-controls button:hover { background: #f1f1eb; }
    .zoom-level { min-width: 38px; text-align: center; color: #8b9087; font-size: 10px; }
    .map-legend { position: absolute; bottom: 18px; left: 20px; z-index: 3; display: flex; gap: 12px; color: #92968f; font-size: 10px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 7px; height: 7px; background: #6f8e76; border-radius: 50%; }
    .legend-dot.idea { background: #a18bbc; }
    .legend-dot.side { background: #d2a85e; }
    .graph-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; color: #94988f; font-size: 10px; }
    .graph-footer button { border: 0; background: transparent; color: #56735d; font-size: 11px; font-weight: 600; }

    .detail-panel { min-width: 0; border-left: 1px solid var(--line); background: #fffefa; display: flex; flex-direction: column; }
    .detail-head { padding: 23px 21px 17px; border-bottom: 1px solid #efeee8; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; }
    .detail-kicker { color: #93978f; text-transform: uppercase; letter-spacing: .11em; font-size: 9px; font-weight: 700; }
    .detail-title { margin: 10px 0 0; font-weight: 660; font-size: 17px; line-height: 1.45; letter-spacing: -.02em; }
    .detail-meta { margin-top: 8px; display: flex; align-items: center; gap: 7px; color: #999d96; font-size: 10px; }
    .detail-meta .pill { color: #65806a; padding: 4px 7px; border-radius: 6px; background: #edf2eb; }
    .detail-actions { padding: 14px 20px; display: flex; gap: 7px; border-bottom: 1px solid #efeee8; }
    .action-button { flex: 1; height: 35px; border: 1px solid #e9e7df; background: #fffefa; border-radius: 9px; color: #586158; font-size: 11px; font-weight: 600; }
    .action-button.primary { border-color: var(--green); background: var(--green); color: white; }
    .action-button:hover { filter: brightness(.97); }
    .detail-scroll { overflow-y: auto; flex: 1; padding: 19px 20px 12px; }
    .path-label { font-size: 10px; font-weight: 700; color: #8f958c; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 13px; }
    .path-list { display: grid; gap: 0; margin-bottom: 24px; }
    .path-step { position: relative; display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 0 0 13px; color: #697168; font-size: 11px; }
    .path-step:not(:last-child):before { content: ""; position: absolute; width: 1px; background: #e4e5de; left: 5px; top: 12px; bottom: 0; }
    .path-bullet { width: 11px; height: 11px; flex: none; border-radius: 50%; margin-top: 1px; background: #d4d9d1; border: 2px solid #fffefa; box-shadow: 0 0 0 1px #d4d9d1; z-index: 1; }
    .path-step.current { color: #315b48; font-weight: 650; }
    .path-step.current .path-bullet { background: #63836b; box-shadow: 0 0 0 1px #63836b; }
    .message-card { border: 1px solid #efeee7; border-radius: 12px; padding: 13px; margin-bottom: 11px; background: #fff; }
    .message-author { display: flex; gap: 7px; align-items: center; color: #92968f; font-size: 10px; margin-bottom: 9px; }
    .message-author .mini-avatar { width: 19px; height: 19px; display: grid; place-items: center; border-radius: 7px; color: #496b53; background: #edf2eb; font-size: 10px; }
    .message-text { font-size: 12px; line-height: 1.75; color: #51584f; }
    .insight { margin: 13px 0 0; padding: 11px 12px; background: #f6f3fa; border-left: 2px solid #a18bbc; border-radius: 0 8px 8px 0; color: #655c72; font-size: 11px; line-height: 1.65; }
    .composer { padding: 12px 16px 15px; border-top: 1px solid #efeee8; background: #fffefa; }
    .composer-box { border: 1px solid #e7e5de; border-radius: 12px; padding: 10px 11px 7px; background: white; box-shadow: 0 3px 10px #00000005; }
    .composer textarea { display: block; width: 100%; height: 48px; border: 0; outline: 0; resize: none; color: #424a42; font-size: 11px; line-height: 1.6; }
    .composer textarea::placeholder { color: #adb0a9; }
    .composer-bottom { display: flex; justify-content: space-between; align-items: center; }
    .composer-hint { color: #a1a49d; font-size: 9px; }
    .send-button { width: 28px; height: 28px; border: 0; border-radius: 8px; background: var(--green); color: white; font-size: 13px; }
    .composer-caption { margin-top: 8px; color: #a2a69e; text-align: center; font-size: 9px; }
    .toast { position: fixed; z-index: 9; left: 50%; bottom: 25px; transform: translate(-50%,12px); opacity: 0; pointer-events: none; background: #283b2f; color: white; border-radius: 9px; padding: 10px 15px; font-size: 12px; box-shadow: var(--shadow); transition: opacity .18s, transform .18s; }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .modal-backdrop { position: fixed; display: none; inset: 0; z-index: 8; background: #1b211e55; align-items: flex-start; justify-content: center; padding-top: 15vh; }
    .modal-backdrop.show { display: flex; }
    .search-modal { width: min(560px, calc(100vw - 30px)); border: 1px solid #e6e5df; border-radius: 15px; background: #fffefa; box-shadow: 0 22px 70px #16221835; overflow: hidden; }
    .search-top { padding: 15px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
    .search-top input { flex: 1; border: 0; outline: 0; font-size: 13px; background: transparent; }
    .search-hint { padding: 10px 16px 5px; color: #a0a39c; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
    .search-results { max-height: 340px; overflow: auto; padding: 5px 8px 10px; }
    .search-result { width: 100%; border: 0; background: transparent; display: flex; text-align: left; gap: 10px; align-items: center; border-radius: 9px; padding: 10px; }
    .search-result:hover { background: #f3f3ed; }
    .search-result .result-dot { width: 8px; height: 8px; border-radius: 50%; background: #749078; }
    .search-result small { display: block; color: #999e95; font-size: 10px; margin-top: 3px; }
    .search-empty { padding: 20px; color: #9a9e96; text-align: center; font-size: 12px; }
    @media (max-width: 1120px) { .content { grid-template-columns: minmax(430px,1fr) 330px; } .workspace { padding-left: 18px; padding-right: 18px; } .node { width: 185px; } .node.root { width: 195px; } }
    @media (max-width: 900px) { .sidebar { width: 68px; flex-basis: 68px; padding-left: 10px; padding-right: 10px; } .sidebar .brand-copy,.sidebar .new-label,.sidebar .sidebar-label,.sidebar .nav-copy,.sidebar .count,.sidebar .conversation-list,.sidebar .profile-copy { display:none; } .sidebar .brand { padding:0 6px; } .sidebar .new-chat,.sidebar .nav-item,.sidebar .profile { justify-content:center; padding-left:0; padding-right:0; } .content { grid-template-columns: minmax(0,1fr) 305px; } .detail-panel { width:305px; } .node { width:166px; padding:11px; } .node.root { width:178px; } }
    @media (max-width: 700px) { .app { min-height: 600px; } .sidebar { display:none; } .topbar { height:54px; padding:0 13px; } .save-indicator,.crumb span:first-child { display:none; } .content { display:flex; flex-direction:column; overflow:auto; } .workspace { min-height:560px; padding:17px 13px 12px; } .map-card { min-height:440px; } .detail-panel { width:auto; min-height:560px; border-left:0; border-top:1px solid var(--line); } .node { width:158px; min-height:83px; } .node.root { width:170px; } .node-title { font-size:11px; } .view-actions .quiet-btn { padding:0 7px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">织</div><div class="brand-copy"><div class="brand-name">织思 <span style="font-weight:450;color:#7e887c">Weave</span></div><span class="brand-sub">THINK IN THREADS</span></div></div>
      <button class="new-chat" id="newChat"><span style="font-size:17px">＋</span><span class="new-label">开启新探索</span></button>
      <div class="sidebar-label">工作区</div>
      <div class="nav-item active" id="mapNav"><span class="nav-icon">◈</span><span class="nav-copy">思维图谱</span><span class="count">⌘1</span></div>
      <div class="nav-item" id="searchNav"><span class="nav-icon">⌕</span><span class="nav-copy">搜索对话</span><span class="count">⌘K</span></div>
      <div class="nav-item" id="savedNav"><span class="nav-icon">☆</span><span class="nav-copy">灵感收藏</span><span class="count" id="savedCount">2</span></div>
      <div class="sidebar-label">最近探索</div>
      <div class="conversation-list">
        <button class="conversation active" id="currentChat">AI 对话为什么越聊越散？<small>今天 · 12 个想法</small></button>
        <button class="conversation" data-toast="这条探索暂未加入演示内容">个人知识库怎么搭？<small>昨天 · 8 个想法</small></button>
        <button class="conversation" data-toast="这条探索暂未加入演示内容">给一个新点子找用户<small>周一 · 6 个想法</small></button>
      </div>
      <div class="sidebar-spacer"></div>
      <div class="profile"><div class="avatar">林</div><div class="profile-copy"><div class="profile-name">林同学</div><div class="profile-plan">个人探索空间</div></div><button class="icon-btn" style="margin-left:auto">···</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left"><button class="icon-btn" id="toggleSidebar" aria-label="收起侧栏">☰</button><div class="crumb"><span>工作区　/　</span><strong>AI 对话为什么越聊越散？</strong></div></div>
        <div class="top-actions"><span class="save-indicator" id="saveStatus">已自动保存</span><button class="quiet-btn" id="shareBtn">↗　分享</button><button class="icon-btn" id="moreBtn">···</button></div>
      </header>
      <div class="content">
        <section class="workspace">
          <div class="workspace-heading">
            <div><div class="eyebrow">一场正在生长的探索</div><h1>AI 对话为什么越聊越散？</h1><div class="subtitle">把好奇心留在图上，把主线留在手边。</div></div>
            <div class="view-actions"><button class="quiet-btn" id="routeBtn">⌁　探索路线</button><button class="quiet-btn" id="fitBtn">⊙　回到全图</button></div>
          </div>
          <div class="map-card" id="mapCard">
            <div class="canvas-note"><strong>对话地图</strong><span id="nodeCount">12 个节点 · 3 条分支</span></div>
            <div class="map-world" id="mapWorld"><svg class="edges" id="edges" viewBox="0 0 1000 700" preserveAspectRatio="none"></svg><div id="nodes"></div></div>
            <div class="map-legend"><span class="legend-item"><i class="legend-dot"></i>主线</span><span class="legend-item"><i class="legend-dot idea"></i>灵感</span><span class="legend-item"><i class="legend-dot side"></i>支线</span></div>
            <div class="zoom-controls"><button id="zoomOut" aria-label="缩小">−</button><span class="zoom-level" id="zoomLevel">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="resetZoom" aria-label="重置缩放">⌖</button></div>
          </div>
          <div class="graph-footer"><span>点击任意节点回到那一刻的思路</span><button id="addFromRoot">＋　从主线继续</button></div>
        </section>
        <aside class="detail-panel">
          <div class="detail-head"><div class="detail-row"><span class="detail-kicker">当前思路节点</span><button class="icon-btn" id="bookmarkBtn" title="收藏节点">☆</button></div><h2 class="detail-title" id="detailTitle"></h2><div class="detail-meta"><span class="pill" id="detailType"></span><span id="detailTime"></span><span>·</span><span id="childCount"></span></div></div>
          <div class="detail-actions"><button class="action-button" id="returnParent">↶　回到上一步</button><button class="action-button primary" id="branchBtn">＋　从此处开支线</button></div>
          <div class="detail-scroll"><div class="path-label">这条思路怎么走到这里</div><div class="path-list" id="pathList"></div><div id="messages"></div></div>
          <form class="composer" id="composer"><div class="composer-box"><textarea id="promptInput" placeholder="继续追问，或把突然想到的事记下来…"></textarea><div class="composer-bottom"><span class="composer-hint">发送后会接在当前节点下</span><button class="send-button" aria-label="发送">↑</button></div></div><div class="composer-caption">织思会保留每条支线的来处，你可以随时回来。</div></form>
        </aside>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="searchModal"><div class="search-modal"><div class="search-top"><span style="color:#92978e">⌕</span><input id="searchInput" placeholder="搜索这场对话里的问题、想法…" /><button class="icon-btn" id="closeSearch">Esc</button></div><div class="search-hint">跳转到节点</div><div class="search-results" id="searchResults"></div></div></div>
  <script>
    const starterNodes = [
      {id:'root', parent:null, x:19, y:51, kind:'主线', title:'AI 对话为什么越聊越散？', time:'10:02', prompt:'我发现跟 AI 聊久了，明明一开始有个目标，后来会不断冒出别的问题，最后反而找不到重点。为什么会这样？', answer:'因为普通聊天把所有内容都放在同一条时间线上。新想法一出现，你只能打断当前问题，或者先记在脑子里。久了之后，主线、临时好奇和已经解决的问题混在一起。', insight:'真正的摩擦可能不是“想法太多”，而是没有一种低成本的方式把新想法暂存成可返回的分支。', chips:['核心问题','对话结构']},
      {id:'branching', parent:'root', x:49, y:29, kind:'灵感', title:'人为什么会在对话中不断联想？', time:'10:08', prompt:'为什么一个答案会让我想到另一个完全不同的问题？', answer:'对话会激活关联记忆：一个概念、一段例子或一个未解释的细节，都可能成为新的探索入口。发散本身有价值，问题在于现有聊天界面把它当成了对主线的插入。', insight:'设计目标不是压住联想，而是让联想先落地，再决定何时深入。', chips:['认知线索','可暂存']},
      {id:'flow', parent:'root', x:49, y:72, kind:'主线', title:'怎样不中断当前任务地探索侧问题？', time:'10:14', prompt:'如果我不想丢掉当前上下文，又想先问一个侧面问题，交互上可以怎么做？', answer:'把“继续当前对话”和“从这里另开一条探索”变成并列选择。侧支继承它的起点上下文，但后续内容独立生长，回到主线时仍能看到自己从哪里离开。', insight:'关键体验：侧问题可以被捕捉，但用户必须保有路线选择权。', chips:['关键交互','上下文来源']},
      {id:'memory', parent:'branching', x:79, y:29, kind:'支线', title:'让 AI 自动总结，还是由我来整理？', time:'10:22', prompt:'图谱里的想法要由 AI 自动归纳，还是让用户自己命名和整理？', answer:'可以让系统提供轻量默认值，例如问题标题和来源节点；但归类、合并、收藏最好可由用户修正。否则自动整理会把不成熟的想法过早定型。', insight:'把自动化放在“降低记录成本”，把命名和取舍留给用户。', chips:['控制感','信息架构']},
      {id:'layout', parent:'flow', x:79, y:70, kind:'支线', title:'图谱和聊天窗该怎样分配空间？', time:'10:29', prompt:'用户需要同时看见关系和完整聊天内容，界面怎么排更自然？', answer:'可以用图谱负责导航和空间关系，用对话面板承载选中节点的完整上下文。点节点相当于回到那个时刻，而不是把所有文字都塞进一张大地图。', insight:'图谱是“目录与路线”，对话仍是主要阅读界面。', chips:['界面布局','双视图']},
      {id:'prototype', parent:'flow', x:49, y:91, kind:'待验证', title:'第一版先验证哪一个动作？', time:'10:36', prompt:'我做课程原型时，应该先把哪些能力做出来？', answer:'先验证一个完整闭环：选中一段对话，从该处开支线，继续追问，再一键回到主线。搜索、自动摘要和多人协作可以先放到后续。', insight:'如果用户能说清分支从哪里来、如何返回，就已经验证了产品最核心的结构。', chips:['MVP','可点击原型']}
    ];
    let nodes = JSON.parse(localStorage.getItem('weave-nodes') || 'null') || starterNodes;
    let selectedId = localStorage.getItem('weave-selected') || 'flow';
    let zoom = 1;
    let bookmarks = JSON.parse(localStorage.getItem('weave-bookmarks') || '["root","flow"]');
    let toastTimer;
    const $ = id => document.getElementById(id);
    const selected = () => nodes.find(n => n.id === selectedId) || nodes[0];
    function persist() { localStorage.setItem('weave-nodes', JSON.stringify(nodes)); localStorage.setItem('weave-selected', selectedId); localStorage.setItem('weave-bookmarks', JSON.stringify(bookmarks)); $('saveStatus').textContent = '已自动保存'; }
    function notify(message) { const el=$('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }
    function childrenOf(id) { return nodes.filter(n=>n.parent===id); }
    function pathOf(node) { const path=[]; let cur=node; while(cur){ path.unshift(cur); cur=nodes.find(n=>n.id===cur.parent); } return path; }
    function render() {
      const active=selected();
      const svg=$('edges'); svg.innerHTML='';
      nodes.filter(n=>n.parent).forEach(n=>{
        const p=nodes.find(x=>x.id===n.parent); if(!p) return;
        const x1=p.x*10, y1=p.y*7, x2=n.x*10, y2=n.y*7, mid=(x1+x2)/2;
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d',`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
        path.setAttribute('class','edge'+((n.id===selectedId||p.id===selectedId)?' active':'')); svg.appendChild(path);
      });
      const wrap=$('nodes'); wrap.innerHTML='';
      nodes.forEach(n=>{
        const button=document.createElement('button'); button.className='node'+(n.id==='root'?' root':'')+(n.id===selectedId?' selected':'');
        button.style.left=n.x+'%'; button.style.top=n.y+'%';
        const typeDot=n.kind==='灵感'?'style="background:#a18bbc"':n.kind==='支线'?'style="background:#d2a85e"':n.kind==='待验证'?'style="background:#9a9f95"':'';
        button.innerHTML=`<div class="node-meta"><span class="node-type"><i class="node-dot" ${typeDot}></i>${n.kind}</span><span>${n.time}</span></div><div class="node-title">${escapeHtml(n.title)}</div><div class="node-footer"><span class="node-chip">${childrenOf(n.id).length} 个后续</span>${bookmarks.includes(n.id)?'<span class="node-chip">☆ 已收藏</span>':''}</div>`;
        button.addEventListener('click',()=>{selectedId=n.id; persist(); render();}); wrap.appendChild(button);
      });
      $('detailTitle').textContent=active.title; $('detailType').textContent=active.kind; $('detailTime').textContent='今天 '+active.time; $('childCount').textContent=childrenOf(active.id).length+' 个后续';
      $('bookmarkBtn').textContent=bookmarks.includes(active.id)?'★':'☆'; $('bookmarkBtn').style.color=bookmarks.includes(active.id)?'#bf9b51':'';
      $('nodeCount').textContent=nodes.length+' 个节点 · '+Math.max(1,nodes.filter(n=>n.parent==='root').length)+' 条分支';
      const pathList=$('pathList'); pathList.innerHTML='';
      pathOf(active).forEach(step=>{const b=document.createElement('button');b.className='path-step'+(step.id===selectedId?' current':'');b.innerHTML=`<i class="path-bullet"></i><span>${escapeHtml(step.title)}</span>`;b.onclick=()=>{selectedId=step.id;persist();render();};pathList.appendChild(b);});
      $('messages').innerHTML=`<div class="message-card"><div class="message-author"><span class="mini-avatar">你</span>你的问题</div><div class="message-text">${escapeHtml(active.prompt)}</div></div><div class="message-card"><div class="message-author"><span class="mini-avatar">✳</span>AI 的回应</div><div class="message-text">${escapeHtml(active.answer)}</div><div class="insight">${escapeHtml(active.insight||'这条想法已被保存在探索路线中。')}</div></div>`;
      $('returnParent').disabled=!active.parent; $('returnParent').style.opacity=active.parent?1:.45;
      $('savedCount').textContent=bookmarks.length;
      renderSearch($('searchInput').value || '');
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function renderSearch(query) {
      const q=(query||'').trim().toLowerCase(); const list=nodes.filter(n=>!q||[n.title,n.prompt,n.answer,n.kind].join(' ').toLowerCase().includes(q)); const el=$('searchResults');
      el.innerHTML=list.length?list.map(n=>`<button class="search-result" data-id="${n.id}"><i class="result-dot"></i><span>${escapeHtml(n.title)}<small>${escapeHtml(n.kind)} · ${n.time}</small></span></button>`).join(''):'<div class="search-empty">没有找到相关节点。试试另一个词。</div>';
      el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;persist();render();closeSearch();});
    }
    function closeSearch(){ $('searchModal').classList.remove('show'); $('searchInput').value=''; renderSearch(''); }
    function openSearch(){ $('searchModal').classList.add('show'); $('searchInput').focus(); renderSearch(''); }
    function addNode({parentId=selectedId,title,prompt,answer,kind='支线',x,y}={}) {
      const parent=nodes.find(n=>n.id===parentId)||nodes[0];
      const siblings=childrenOf(parent.id).length;
      const newNode={id:'n'+Date.now(),parent:parent.id,x:x??Math.min(81,parent.x+27),y:y??Math.max(16,Math.min(85,parent.y+(siblings%2===0?17:-16))),kind,title:title||'新的探索分支',time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),prompt:prompt||'我想从这里继续探索一个新问题。',answer:answer||'这是一个可继续发展的新分支。它保留了当前节点作为上下文来源，后续问题会留在这条路线里。',insight:'这条分支从「'+parent.title+'」开始。你可以继续深入，也可以随时返回上一级。',chips:['新分支','可返回']};
      nodes.push(newNode); selectedId=newNode.id; persist(); render(); $('promptInput').focus(); notify('新分支已从当前节点展开');
    }
    $('branchBtn').onclick=()=>addNode({kind:'支线'});
    $('addFromRoot').onclick=()=>addNode({parentId:'root',kind:'主线',title:'继续探索：新的问题',prompt:'沿着主线，我接下来想弄清楚什么？'});
    $('returnParent').onclick=()=>{const n=selected();if(n.parent){selectedId=n.parent;persist();render();}};
    $('bookmarkBtn').onclick=()=>{if(bookmarks.includes(selectedId))bookmarks=bookmarks.filter(id=>id!==selectedId);else bookmarks.push(selectedId);persist();render();notify(bookmarks.includes(selectedId)?'已收藏这个想法':'已取消收藏');};
    $('composer').addEventListener('submit',e=>{e.preventDefault();const val=$('promptInput').value.trim();if(!val){$('promptInput').focus();return;}addNode({title:val.length>22?val.slice(0,22)+'…':val,prompt:val,answer:'这是原型中的模拟回应。它接在当前节点之后，因此你可以在图谱上看到这次追问的来处；真正的 AI 回答能力尚未接入。',kind:'追问'});$('promptInput').value='';});
    $('newChat').onclick=()=>{const id='root'+Date.now();nodes=[{...starterNodes[0],id,title:'新的探索从哪里开始？',prompt:'我想和 AI 一起探索一个新主题。',answer:'先写下你此刻最想弄清楚的问题。之后出现的侧问题都可以单独分出去。',time:'现在',parent:null,x:24,y:52}];selectedId=id;bookmarks=[];persist();render();notify('已开启一场新的探索');};
    $('toggleSidebar').onclick=()=> $('sidebar').classList.toggle('collapsed');
    $('searchNav').onclick=openSearch;
    $('searchInput').addEventListener('input',e=>renderSearch(e.target.value));
    $('closeSearch').onclick=closeSearch;
    $('searchModal').addEventListener('click',e=>{if(e.target===$('searchModal'))closeSearch();});
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}if(e.key==='Escape')closeSearch();});
    $('zoomIn').onclick=()=>setZoom(zoom+.1); $('zoomOut').onclick=()=>setZoom(zoom-.1); $('resetZoom').onclick=()=>setZoom(1); $('fitBtn').onclick=()=>setZoom(1);
    function setZoom(v){zoom=Math.max(.75,Math.min(1.35,v));$('mapWorld').style.setProperty('--zoom',zoom);$('zoomLevel').textContent=Math.round(zoom*100)+'%';}
    $('shareBtn').onclick=()=>{navigator.clipboard?.writeText(location.href).catch(()=>{});notify('原型链接已准备好分享');};
    $('moreBtn').onclick=()=>notify('更多操作将在后续版本开放');
    $('routeBtn').onclick=()=>{const path=pathOf(selected()).map(n=>n.title).join('  →  ');notify(path.length>75?path.slice(0,72)+'…':path);};
    $('savedNav').onclick=()=>{const first=nodes.find(n=>bookmarks.includes(n.id));if(first){selectedId=first.id;persist();render();notify('已跳转到收藏的想法');}else notify('还没有收藏的想法');};
    document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>notify(b.dataset.toast));
    render();
  </script>
</body>
</html>
